<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 禁用使用者手勢縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phonics Spelling Battle</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            
            --team-a-color: #38bdf8;
            --team-b-color: #f43f5e;
            
            --card-bg: #334155;
            --card-text: #f8fafc;
            --card-active-bg: #4f46e5;
            
            --slot-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            
            /* 平板防誤觸核心 */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 12px;
            background-color: var(--bg-color);
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 12px;
            height: 50px;
            flex-shrink: 0;
        }

        .setup-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .setup-group label {
            font-size: 14px;
            font-weight: bold;
            color: #94a3b8;
            white-space: nowrap;
        }

        input[type="text"] {
            flex: 1;
            padding: 6px 12px;
            font-size: 15px;
            background-color: var(--bg-color);
            color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        input[type="text"]:focus {
            border-color: #6366f1;
        }

        button {
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-generate { background-color: #6366f1; color: white; }
        .btn-clear { background-color: #475569; color: white; }
        .btn-reset { background-color: #dc2626; color: white; }

        .game-arena {
            display: flex;
            flex: 1;
            gap: 12px;
            height: calc(100vh - 74px);
        }

        .team-column {
            flex: 1;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            display: grid;
            grid-template-rows: auto 50vh 1fr; 
            gap: 8px;
        }

        .team-a { border-top: 6px solid var(--team-a-color); }
        .team-b { border-top: 6px solid var(--team-b-color); }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .team-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .team-a .team-name { color: var(--team-a-color); }
        .team-b .team-name { color: var(--team-b-color); }

        .score-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .score-display {
            font-size: 24px;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        .btn-add-score {
            padding: 4px 12px;
            font-size: 15px;
        }
        .team-a .btn-add-score { background-color: var(--team-a-color); color: #0f172a; }
        .team-b .btn-add-score { background-color: var(--team-b-color); color: #ffffff; }

        .zone-label {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .answer-zone-container, .pool-zone-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }

        .answer-zone {
            flex: 1;
            background-color: var(--slot-bg);
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            align-content: center;
            overflow-y: auto;
        }

        .pool-zone {
            flex: 1;
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-content: flex-start;
            overflow-y: auto;
        }

        /* 關鍵修正 1：字卡基礎樣式 */
        .card {
            background-color: var(--card-bg);
            color: var(--card-text);
            border: 2px solid #475569;
            border-bottom: 4px solid #1e293b;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s, background-color 0.15s;
        }

        .card:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        /* 關鍵修正 2：強制指定備選區 Word Cards 的大小（加上 !important 蓋掉 JS 的殘留設定） */
        .pool-zone .card {
            font-size: 24px !important;
            padding: 8px 16px !important;
            background-color: var(--card-bg) !important;
            border-color: #475569 !important;
        }

        /* 拼字區卡片主題顏色 */
        .answer-zone .card {
            background-color: var(--card-active-bg);
            border-color: #6366f1;
            border-bottom-color: #3730a3;
            color: #ffffff;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="setup-group">
            <label for="cards-input">Phonics Cards:</label>
            <input type="text" id="cards-input" value="cl ou d y sh ee p th ing" placeholder="e.g. cl ou d y sh ee p">
            <button class="btn-generate" onclick="initGame()">Generate</button>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-clear" onclick="clearAnswers()">Clear Slots</button>
            <button class="btn-reset" onclick="resetScores()">Reset Scores</button>
        </div>
    </div>

    <div class="game-arena">
        <!-- Team A -->
        <div class="team-column team-a">
            <div class="team-header">
                <div class="team-name">Team A</div>
                <div class="score-control">
                    <span class="score-display" id="score-a">0</span>
                    <button class="btn-add-score" onclick="addScore('a')">+1</button>
                </div>
            </div>

            <div class="answer-zone-container">
                <div class="zone-label">Spelling Area</div>
                <div class="answer-zone" id="answer-a"></div>
            </div>

            <div class="pool-zone-container">
                <div class="zone-label">Word Cards</div>
                <div class="pool-zone" id="pool-a"></div>
            </div>
        </div>

        <!-- Team B -->
        <div class="team-column team-b">
            <div class="team-header">
                <div class="team-name">Team B</div>
                <div class="score-control">
                    <span class="score-display" id="score-b">0</span>
                    <button class="btn-add-score" onclick="addScore('b')">+1</button>
                </div>
            </div>

            <div class="answer-zone-container">
                <div class="zone-label">Spelling Area</div>
                <div class="answer-zone" id="answer-b"></div>
            </div>

            <div class="pool-zone-container">
                <div class="zone-label">Word Cards</div>
                <div class="pool-zone" id="pool-b"></div>
            </div>
        </div>
    </div>

    <script>
        let scoreA = 0;
        let scoreB = 0;

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            let newArr = [...array];
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [newArr[currentIndex], newArr[randomIndex]] = [newArr[randomIndex], newArr[currentIndex]];
            }
            return newArr;
        }

        function initGame() {
            const input = document.getElementById('cards-input').value.trim();
            if (!input) return;

            const cards = input.split(/[, \t]+/).filter(item => item.length > 0);

            setupTeamPool('pool-a', 'answer-a', shuffle(cards));
            setupTeamPool('pool-b', 'answer-b', shuffle(cards));
        }

        function setupTeamPool(poolId, answerId, cards) {
            const poolEl = document.getElementById(poolId);
            const answerEl = document.getElementById(answerId);
            
            poolEl.innerHTML = '';
            answerEl.innerHTML = '';

            cards.forEach((text) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = text;
                card.setAttribute('draggable', 'false');

                card.onclick = () => {
                    if (card.parentElement === poolEl) {
                        answerEl.appendChild(card);
                    } else {
                        // 回到備選區
                        poolEl.appendChild(card);
                        card.style.fontSize = ''; // 清除 JS 設定
                        card.style.padding = '';
                    }
                    adjustAnswerFontSize(answerEl);
                };

                poolEl.appendChild(card);
            });
        }

        // 只針對「拼字區（answerZone）」裡面的卡片做動態大小調整
        function adjustAnswerFontSize(answerZone) {
            const cards = answerZone.querySelectorAll('.card');
            const count = cards.length;

            cards.forEach(card => {
                if (count <= 4) {
                    card.style.fontSize = '42px';
                    card.style.padding = '12px 24px';
                } else if (count <= 6) {
                    card.style.fontSize = '32px';
                    card.style.padding = '10px 18px';
                } else if (count <= 8) {
                    card.style.fontSize = '26px';
                    card.style.padding = '8px 14px';
                } else {
                    card.style.fontSize = '20px';
                    card.style.padding = '6px 10px';
                }
            });
        }

        function addScore(team) {
            if (team === 'a') {
                scoreA++;
                document.getElementById('score-a').innerText = scoreA;
            } else if (team === 'b') {
                scoreB++;
                document.getElementById('score-b').innerText = scoreB;
            }
        }

        function resetScores() {
            scoreA = 0;
            scoreB = 0;
            document.getElementById('score-a').innerText = '0';
            document.getElementById('score-b').innerText = '0';
        }

        function clearAnswers() {
            const returnCards = (answerId, poolId) => {
                const answerZone = document.getElementById(answerId);
                const poolZone = document.getElementById(poolId);
                while (answerZone.firstChild) {
                    const card = answerZone.firstChild;
                    card.style.fontSize = '';
                    card.style.padding = '';
                    poolZone.appendChild(card);
                }
                adjustAnswerFontSize(answerZone);
            };
            returnCards('answer-a', 'pool-a');
            returnCards('answer-b', 'pool-b');
        }

        window.onload = initGame;
    </script>
</body>
</html>
